<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <style>@view-transition{navigation:auto}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meridian - Analog Clock</title>

  <!-- Favicon: brass watch face -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23141310' stroke='%23c8a45c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23c8a45c' stroke-width='0.75' opacity='0.5'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23c8a45c'/%3E%3Cline x1='16' y1='16' x2='16' y2='7' stroke='%23e8dcc3' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='16' y1='16' x2='22.5' y2='19' stroke='%23c8a45c' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="vignette" aria-hidden="true"></div>

  <!-- Header plaque -->
  <header>
    <div class="header-left">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
        <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
        <line x1="12" y1="12" x2="12" y2="6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="12" y1="12" x2="16.5" y2="14" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <span class="header-title">Meridian</span>
      <span class="header-sub">Fine Timekeeping</span>
    </div>

    <div class="header-controls">
      <button class="pill-btn" id="toggleHour" title="Toggle 12/24h">12h</button>

      <select id="tzSelect" class="tz-select" title="Timezone">
        <option value="local">Local</option>
        <option value="America/New_York">New York</option>
        <option value="America/Los_Angeles">Los Angeles</option>
        <option value="Europe/London">London</option>
        <option value="Europe/Paris">Paris</option>
        <option value="Asia/Dubai">Dubai</option>
        <option value="Asia/Karachi">Karachi</option>
        <option value="Asia/Kolkata">Mumbai</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="Australia/Sydney">Sydney</option>
      </select>

      <!-- Dial finishes -->
      <div class="theme-switcher" role="group" aria-label="Dial finish">
        <button class="theme-dot active" data-theme="obsidian" title="Obsidian &amp; Brass"  style="--c:#c8a45c"></button>
        <button class="theme-dot" data-theme="marine"   title="Marine &amp; Steel"    style="--c:#8fb3cc"></button>
        <button class="theme-dot" data-theme="bordeaux" title="Bordeaux &amp; Gold"   style="--c:#b0413e"></button>
        <button class="theme-dot" data-theme="ivory"    title="Ivory Enamel"          style="--c:#e9e2d0"></button>
        <button class="theme-dot" data-theme="racing"   title="Racing Green"          style="--c:#3e6b4f"></button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="clock-wrap">
      <div class="bezel-shadow" aria-hidden="true"></div>
      <svg id="clockSVG" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="faceBg" cx="50%" cy="38%" r="70%">
            <stop offset="0%"   stop-color="var(--face-light)"/>
            <stop offset="100%" stop-color="var(--face-dark)"/>
          </radialGradient>
          <linearGradient id="bezelBrush" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="var(--bezel-hi)"/>
            <stop offset="45%"  stop-color="var(--bezel-lo)"/>
            <stop offset="55%"  stop-color="var(--bezel-hi)"/>
            <stop offset="100%" stop-color="var(--bezel-lo)"/>
          </linearGradient>
          <filter id="handGlow">
            <feGaussianBlur stdDeviation="1.2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Bezel -->
        <circle cx="150" cy="150" r="149" fill="url(#bezelBrush)" />
        <circle cx="150" cy="150" r="144" fill="var(--case-dark)" />
        <circle cx="150" cy="150" r="141" fill="url(#bezelBrush)" opacity="0.85" />

        <!-- Face -->
        <circle cx="150" cy="150" r="138" fill="url(#faceBg)" />
        <!-- Minute track ring -->
        <circle cx="150" cy="150" r="126" fill="none" stroke="var(--tick-minor)" stroke-width="0.5" opacity="0.6"/>
        <circle cx="150" cy="150" r="98"  fill="none" stroke="var(--tick-minor)" stroke-width="0.5" opacity="0.35"/>

        <!-- Maker's mark -->
        <text x="150" y="102" text-anchor="middle" font-family="Cinzel, serif"
              font-size="10.5" letter-spacing="3.5" fill="var(--accent)">MERIDIAN</text>
        <text x="150" y="206" text-anchor="middle" font-family="Cormorant Garamond, serif"
              font-size="8" letter-spacing="2" font-style="italic" fill="var(--num-color)" opacity="0.55">swiss movement</text>

        <!-- Tick marks -->
        <g id="ticks"></g>

        <!-- Hour numbers -->
        <g id="numbers" font-family="Cinzel, serif" text-anchor="middle" dominant-baseline="central"></g>

        <!-- Hour hand -->
        <g id="hourHand" style="transform-origin:150px 150px">
          <path d="M150 150 L146 138 L149 76 L150 70 L151 76 L154 138 Z"
                fill="var(--hand-hour)" filter="url(#handGlow)"/>
          <path d="M149 130 L149.6 82 L150.4 82 L151 130 Z" fill="var(--hand-highlight)" opacity="0.5"/>
        </g>

        <!-- Minute hand -->
        <g id="minuteHand" style="transform-origin:150px 150px">
          <path d="M150 150 L147.2 138 L149.3 52 L150 46 L150.7 52 L152.8 138 Z"
                fill="var(--hand-minute)" filter="url(#handGlow)"/>
          <path d="M149.4 130 L149.7 58 L150.3 58 L150.6 130 Z" fill="var(--hand-highlight)" opacity="0.45"/>
        </g>

        <!-- Second hand with counterweight -->
        <g id="secondHand" style="transform-origin:150px 150px">
          <rect x="149.35" y="152" width="1.3" height="32" rx="0.65" fill="var(--accent)" />
          <circle cx="150" cy="184" r="4" fill="none" stroke="var(--accent)" stroke-width="1.3"/>
          <rect x="149.35" y="40"  width="1.3" height="112" rx="0.65" fill="var(--accent)" filter="url(#handGlow)" />
          <circle cx="150" cy="48" r="2.2" fill="var(--accent)"/>
        </g>

        <!-- Center cap -->
        <circle cx="150" cy="150" r="7" fill="url(#bezelBrush)" />
        <circle cx="150" cy="150" r="4.5" fill="var(--case-dark)" />
        <circle cx="150" cy="150" r="2.4" fill="var(--accent)" />
      </svg>
    </div>

    <!-- Complication panel -->
    <div class="info-panel">
      <div class="panel-rule" aria-hidden="true"><span>&#10022;</span></div>
      <div id="digitalTime" class="digital-time">00:00:00</div>
      <div id="dateDisplay" class="date-display">Monday, Jan 1, 2025</div>
      <div id="tzLabel" class="tz-label">Local Time</div>
    </div>
  </main>

  <script src="script.js"></script>
<!-- Back to All Projects -->

<a id="back-to-all" href="../" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>

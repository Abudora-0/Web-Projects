<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Six - Sonar Minesweeper</title>
  <meta name="description" content="Deep Six - Minesweeper rebuilt as a submarine sonar console. Sweep the grid, mark the mines, surface without a detonation." />

  <!-- Sonar scope favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1a1f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2346c98a' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%2346c98a' stroke-opacity='.5' stroke-width='1.2'/%3E%3Cpath d='M16 16 L16 6 A10 10 0 0 1 24.7 11 Z' fill='%2346c98a' fill-opacity='.35'/%3E%3Ccircle cx='21' cy='12' r='1.6' fill='%23ffd166'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="hull">
    <div class="rivets" aria-hidden="true"></div>

    <header class="console-top">
      <div class="ident">
        <svg class="ident-mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="20" cy="20" r="9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity=".55" />
          <path d="M20 20 L20 4 A16 16 0 0 1 33 11 Z" fill="currentColor" fill-opacity=".3" />
          <line x1="20" y1="20" x2="34" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <div class="ident-text">
          <span class="ident-name">DEEP SIX</span>
          <span class="ident-sub">SONAR MINE PLOT &middot; STATION SS-6</span>
        </div>
      </div>

      <div class="gauges">
        <div class="gauge">
          <span class="gauge-label">Contacts</span>
          <span class="gauge-val" id="contacts">010</span>
        </div>
        <button class="dive-btn" id="diveBtn" title="New dive (R)">
          <span class="dive-face" id="diveFace">surface</span>
        </button>
        <div class="gauge">
          <span class="gauge-label">Dive time</span>
          <span class="gauge-val" id="clock">000</span>
        </div>
      </div>
    </header>

    <nav class="depth-select" id="depthSelect" aria-label="Patrol depth">
      <button class="depth active" data-level="patrol">
        <span class="depth-no">01</span><span class="depth-name">Patrol</span><span class="depth-spec">9 x 9 &middot; 10</span>
      </button>
      <button class="depth" data-level="hunter">
        <span class="depth-no">02</span><span class="depth-name">Hunter</span><span class="depth-spec">16 x 16 &middot; 40</span>
      </button>
      <button class="depth" data-level="deep">
        <span class="depth-no">03</span><span class="depth-name">Deep</span><span class="depth-spec">30 x 16 &middot; 99</span>
      </button>
      <button class="depth depth-custom" data-level="custom">
        <span class="depth-no">04</span><span class="depth-name">Custom</span><span class="depth-spec" id="customSpec">set below</span>
      </button>
    </nav>

    <div class="custom-rig" id="customRig" hidden>
      <label class="rig-field">
        <span>Columns</span>
        <span class="stepper" data-stepper="cols">
          <button type="button" class="step" data-step="-1" aria-label="Fewer columns">&minus;</button>
          <span class="step-val" id="colsVal">12</span>
          <button type="button" class="step" data-step="1" aria-label="More columns">+</button>
        </span>
      </label>
      <label class="rig-field">
        <span>Rows</span>
        <span class="stepper" data-stepper="rows">
          <button type="button" class="step" data-step="-1" aria-label="Fewer rows">&minus;</button>
          <span class="step-val" id="rowsVal">12</span>
          <button type="button" class="step" data-step="1" aria-label="More rows">+</button>
        </span>
      </label>
      <label class="rig-field">
        <span>Mines</span>
        <span class="stepper" data-stepper="mines">
          <button type="button" class="step" data-step="-1" aria-label="Fewer mines">&minus;</button>
          <span class="step-val" id="minesVal">24</span>
          <button type="button" class="step" data-step="1" aria-label="More mines">+</button>
        </span>
      </label>
      <button class="rig-go" id="rigGo">Begin dive</button>
    </div>

    <main class="scope-wrap">
      <div class="scope" id="scope">
        <div class="sweep" id="sweep" aria-hidden="true"></div>
        <div class="grid" id="grid" role="grid" aria-label="Sonar grid"></div>
        <div class="verdict" id="verdict" hidden>
          <p class="verdict-line" id="verdictLine">All clear</p>
          <p class="verdict-sub" id="verdictSub">Surfaced in 000 seconds</p>
          <button class="verdict-btn" id="verdictBtn">Dive again</button>
        </div>
      </div>
    </main>

    <footer class="console-foot">
      <p class="readout" id="readout">Left-click sweeps a sector. Right-click marks a mine. Clear every safe sector to surface.</p>
      <p class="best" id="best">Best Patrol dive: <span id="bestVal">--</span></p>
    </footer>
  </div>

  <script src="script.js"></script>
<!-- Back to All Projects -->

<a id="back-to-all" href="../" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <style>@view-transition{navigation:auto}::view-transition-group(root),::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:cubic-bezier(.7,0,.3,1)}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sapper - Minesweeper</title>
  <meta name="description" content="Sapper - Minesweeper the way Windows 95 shipped it. Silver bevels, an LED mine counter, the smiley reset button, chording, and a best-times table." />

  <!-- Mine on a silver tile favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c0c0c0'/%3E%3Cpath d='M2 2h28v2H4v24H2z' fill='%23fff'/%3E%3Cpath d='M30 2v28H2v-2h26V2z' fill='%23808080'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23000'/%3E%3Cpath d='M16 5v22M5 16h22M8 8l16 16M24 8L8 24' stroke='%23000' stroke-width='2'/%3E%3Ccircle cx='13.5' cy='13.5' r='2' fill='%23fff'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="win" id="win">
    <div class="titlebar">
      <span class="title-ico" aria-hidden="true">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="#000"/><path d="M8 2v12M2 8h12M4 4l8 8M12 4l-8 8" stroke="#000" stroke-width="1.4"/><circle cx="6.6" cy="6.6" r="1.1" fill="#fff"/></svg>
      </span>
      <span class="title-txt">Sapper</span>
      <span class="title-btns">
        <button class="tb" type="button" disabled aria-hidden="true"><i class="g-min"></i></button>
        <button class="tb" type="button" disabled aria-hidden="true"><i class="g-max"></i></button>
        <a class="tb tb-x" href="../" aria-label="Close (back to projects)"><i class="g-x"></i></a>
      </span>
    </div>

    <div class="menubar">
      <button class="menu-trigger" id="gameBtn" type="button" aria-haspopup="true" aria-expanded="false">Game</button>
      <button class="menu-trigger" id="helpBtn" type="button" aria-haspopup="true" aria-expanded="false">Help</button>

      <div class="menu" id="gameMenu" role="menu" hidden>
        <button class="mi" data-act="new" role="menuitem" type="button">New<span class="mi-key">F2</span></button>
        <hr />
        <button class="mi depth" data-level="patrol" role="menuitemradio" type="button"><span class="mi-tick">&#10003;</span>Beginner</button>
        <button class="mi depth" data-level="hunter" role="menuitemradio" type="button"><span class="mi-tick">&#10003;</span>Intermediate</button>
        <button class="mi depth" data-level="deep" role="menuitemradio" type="button"><span class="mi-tick">&#10003;</span>Expert</button>
        <button class="mi depth" data-level="custom" role="menuitemradio" type="button"><span class="mi-tick">&#10003;</span>Custom...</button>
        <hr />
        <button class="mi" data-act="marks" role="menuitemcheckbox" type="button"><span class="mi-tick">&#10003;</span>Marks (?)</button>
        <button class="mi" data-act="sound" role="menuitemcheckbox" type="button"><span class="mi-tick">&#10003;</span>Sound</button>
        <hr />
        <button class="mi" data-act="best" role="menuitem" type="button">Best Times...</button>
      </div>

      <div class="menu" id="helpMenu" role="menu" hidden>
        <button class="mi" data-act="controls" role="menuitem" type="button">Controls...</button>
        <button class="mi" data-act="about" role="menuitem" type="button">About Sapper...</button>
      </div>
    </div>

    <div class="frame">
      <div class="hdr">
        <div class="led" id="contacts" aria-label="Mines remaining">000</div>
        <button class="smiley" id="diveBtn" type="button" aria-label="New game" data-state="idle"></button>
        <div class="led" id="clock" aria-label="Seconds elapsed">000</div>
      </div>

      <div class="well" id="scope">
        <div class="grid" id="grid" role="grid" aria-label="Minefield"></div>
        <div class="verdict" id="verdict" hidden>
          <div class="dlg">
            <p class="verdict-line" id="verdictLine">You cleared it</p>
            <p class="verdict-sub" id="verdictSub">000 seconds</p>
            <button class="dlg-ok" id="verdictBtn" type="button">New game</button>
          </div>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <span id="readout">Left-click clears a square. Right-click flags a mine. Clear every safe square.</span>
      <span class="best" id="best">Best Beginner: <span id="bestVal">--</span></span>
    </div>
  </div>

  <!-- Custom field dialog -->
  <div class="modal" id="customRig" hidden>
    <div class="dlg dlg-custom">
      <p class="dlg-title">Custom Field</p>
      <label class="rig-field">
        <span>Width</span>
        <span class="stepper" data-stepper="cols">
          <button type="button" class="step" data-step="-1" aria-label="Fewer columns">&minus;</button>
          <span class="step-val" id="colsVal">12</span>
          <button type="button" class="step" data-step="1" aria-label="More columns">+</button>
        </span>
      </label>
      <label class="rig-field">
        <span>Height</span>
        <span class="stepper" data-stepper="rows">
          <button type="button" class="step" data-step="-1" aria-label="Fewer rows">&minus;</button>
          <span class="step-val" id="rowsVal">12</span>
          <button type="button" class="step" data-step="1" aria-label="More rows">+</button>
        </span>
      </label>
      <label class="rig-field">
        <span>Mines</span>
        <span class="stepper" data-stepper="mines">
          <button type="button" class="step" data-step="-1" aria-label="Fewer mines">&minus;</button>
          <span class="step-val" id="minesVal">24</span>
          <button type="button" class="step" data-step="1" aria-label="More mines">+</button>
        </span>
      </label>
      <span class="custom-spec" id="customSpec" hidden>12 x 12</span>
      <div class="dlg-row">
        <button class="dlg-ok" id="rigGo" type="button">New game</button>
        <button class="dlg-cancel" id="rigCancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Info dialogs (Best Times / Controls / About) -->
  <div class="modal" id="infoModal" hidden>
    <div class="dlg dlg-info">
      <p class="dlg-title" id="infoTitle">Best Times</p>
      <div class="dlg-body" id="infoBody"></div>
      <div class="dlg-row"><button class="dlg-ok" id="infoOk" type="button">OK</button></div>
    </div>
  </div>

  <span class="depth-holder" id="depthSelect" hidden></span>

  <script src="script.js"></script>
<!-- Back to All Projects -->

<a id="back-to-all" href="../" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz Master - Test your knowledge with challenging trivia questions. 10 random questions selected from a pool of 30. Play on ArcadeHub!">
  <title>Quiz Master - ArcadeHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .quiz-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: .6rem 0;
      padding: .7rem;
      background: var(--lcd-bg-deep);
      border: 2px solid var(--lcd-ink);
      border-radius: 4px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-box label {
      display: block;
      font-size: 0.68rem;
      color: var(--lcd-ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-family: var(--font-display);
    }

    .stat-box .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lcd-ink);
      font-family: var(--font-display);
    }

    .question-container {
      background: var(--lcd-bg-deep);
      border: 2px solid var(--lcd-ink);
      border-radius: 6px;
      padding: 1.1rem;
      margin: .6rem 0;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .question-number {
      font-size: 0.75rem;
      color: var(--lcd-ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: .5rem;
      font-family: var(--font-display);
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--lcd-ink);
      margin-bottom: .75rem;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .option-btn {
      padding: .65rem .8rem;
      background: var(--lcd-bg);
      border: 2px solid var(--lcd-ink);
      border-radius: 4px;
      color: var(--lcd-ink);
      font-weight: 600;
      cursor: pointer;
      transition: var(--trans);
      font-size: .9rem;
      text-align: left;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--lcd-bg-deep);
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .option-btn.correct {
      background: var(--lcd-good);
      border-color: var(--lcd-good);
      color: var(--lcd-bg);
    }

    .option-btn.incorrect {
      background: var(--lcd-bad);
      border-color: var(--lcd-bad);
      color: var(--lcd-bg);
    }

    .option-btn.skipped {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      font-size: .95rem;
      font-weight: 600;
      margin: .4rem 0;
      min-height: 1.2rem;
      color: var(--lcd-ink);
    }

    .message.success {
      color: var(--lcd-good);
    }

    .message.error {
      color: var(--lcd-bad);
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .6rem;
    }

    .results-container {
      display: none;
      text-align: center;
    }

    .results-container.show {
      display: block;
    }

    .score-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--lcd-ink);
      font-family: var(--font-display);
      margin: .75rem 0;
    }

    .results-message {
      font-size: 1rem;
      color: var(--lcd-ink-soft);
      margin: .5rem 0;
    }

    @media (max-width: 680px) {
      .quiz-stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: .6rem;
      }

      .stat-box .value {
        font-size: 1.2rem;
      }

      .stat-box label {
        font-size: .6rem;
      }
    }

    @media (max-width: 480px) {
      .question-container {
        padding: 1.1rem;
        min-height: 180px;
      }

      .question-text {
        font-size: 1rem;
        margin-bottom: 1rem;
      }

      .option-btn {
        padding: 0.75rem;
        font-size: 0.9rem;
      }

      .score-display {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 4"></path><circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="none"></circle></svg> Quiz Master</h1>
    <a href="index.html" class="back-button"><svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Hub</a>
  </div>

  <div class="game-container">
    <div class="quiz-stats">
      <div class="stat-box">
        <label>Score</label>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat-box">
        <label>Correct</label>
        <div class="value" id="correct">0</div>
      </div>
      <div class="stat-box">
        <label>Best Score</label>
        <div class="value" id="bestScore">0</div>
      </div>
    </div>

    <div id="quizContainer">
      <div class="question-container">
        <div>
          <div class="question-number" id="questionNumber">Question 1 of 10</div>
          <div class="question-text" id="question"></div>
        </div>
        <div class="options" id="options"></div>
      </div>
      <div class="message" id="message"></div>
    </div>

    <div class="results-container" id="results">
      <h2 style="font-size: 1.5rem; color: var(--lcd-ink); margin-bottom: 1rem;">Quiz Complete!</h2>
      <div class="score-display" id="finalScore"></div>
      <div class="results-message" id="resultsMessage"></div>
    </div>

    <div class="controls">
      <button class="btn" onclick="startQuiz()">Start Quiz</button>
      <button class="btn secondary" onclick="location.href='index.html'">Back to Hub</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/quiz.js"></script>

</body>
</html>

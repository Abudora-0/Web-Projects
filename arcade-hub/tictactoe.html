<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tic Tac Toe - Challenge the AI in this classic strategy game. Can you beat the computer? Play on ArcadeHub!">
  <title>Tic Tac Toe - ArcadeHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stat {
      text-align: center;
    }

    .stat label {
      display: block;
      font-size: 0.68rem;
      color: var(--lcd-ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-family: var(--font-display);
    }

    .stat .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lcd-ink);
      font-family: var(--font-display);
    }

    .message {
      text-align: center;
      font-size: .9rem;
      font-weight: 600;
      margin: .4rem 0;
      min-height: 1.2rem;
      color: var(--lcd-ink);
    }

    .message.draw {
      color: var(--lcd-warn);
    }

    .message.win {
      color: var(--lcd-good);
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: .5rem;
    }

    .difficulty {
      text-align: center;
      margin-bottom: .6rem;
    }

    .difficulty-buttons {
      display: flex;
      gap: .6rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .difficulty-btn {
      padding: 0.6rem 1.2rem;
      background: var(--lcd-bg-deep);
      color: var(--lcd-ink);
      border: 2px solid var(--lcd-ink);
      border-radius: 4px;
      font-weight: 700;
      font-size: .75rem;
      font-family: var(--font-display);
      cursor: pointer;
      transition: var(--trans);
    }

    .difficulty-btn.active {
      background: var(--lcd-ink);
      color: var(--lcd-bg);
      border-color: var(--lcd-ink);
    }

    .difficulty-btn:hover {
      background: var(--lcd-bg);
    }

    @media (max-width: 680px) {
      .game-stats { grid-template-columns: repeat(3, 1fr); }
      .stat .value { font-size: 1.2rem; }
      .stat label { font-size: .6rem; }
      .difficulty-buttons { gap: .4rem; }
      .difficulty-btn { flex: 1 1 0; padding: .65rem .3rem; font-size: .68rem; }
    }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg> Tic Tac Toe</h1>
    <a href="index.html" class="back-button"><svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Hub</a>
  </div>

  <div class="game-container">
    <div class="difficulty">
      <label style="color: var(--lcd-ink-soft); margin-bottom: .5rem; display: block; font-size: .85rem;">Choose Difficulty:</label>
      <div class="difficulty-buttons">
        <button class="difficulty-btn active" onclick="setDifficulty('easy')">Easy</button>
        <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium</button>
        <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard</button>
      </div>
    </div>

    <div class="game-stats">
      <div class="stat">
        <label>Wins</label>
        <div class="value" id="wins">0</div>
      </div>
      <div class="stat">
        <label>Draws</label>
        <div class="value" id="draws">0</div>
      </div>
      <div class="stat">
        <label>Losses</label>
        <div class="value" id="losses">0</div>
      </div>
    </div>

    <div class="message" id="message"></div>

    <div class="board" id="board">
      <!-- Cells will be generated by JavaScript -->
    </div>

    <div class="controls">
      <button class="btn" onclick="newGame()">New Game</button>
      <button class="btn secondary" onclick="location.href='index.html'">Back to Hub</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/tictactoe.js"></script>
<a id="back-to-all" href="../" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>

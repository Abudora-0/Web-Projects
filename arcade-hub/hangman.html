<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hangman - Guess the word letter by letter. How many wrong guesses can you afford? Play on ArcadeHub!">
  <title>Hangman - ArcadeHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hangman-display {
      text-align: center;
      font-size: 2.5rem;
      margin: .5rem 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-display {
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: 0.6rem;
      margin: .5rem 0;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: var(--lcd-ink);
      min-height: 44px;
    }

    .guesses-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: .6rem 0;
      background: var(--lcd-bg-deep);
      padding: .7rem;
      border-radius: 4px;
      border: 2px solid var(--lcd-ink);
    }

    .info-item {
      text-align: center;
    }

    .info-label {
      display: block;
      font-size: 0.68rem;
      color: var(--lcd-ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-family: var(--font-display);
    }

    .info-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--lcd-ink);
      font-family: var(--font-display);
    }

    .guessed-letters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: .6rem 0;
      min-height: 40px;
      justify-content: center;
    }

    .letter-btn {
      width: 35px;
      height: 35px;
      padding: 0;
      background: var(--lcd-bg-deep);
      border: 2px solid var(--lcd-ink);
      border-radius: 4px;
      color: var(--lcd-ink);
      font-weight: 700;
      cursor: pointer;
      transition: var(--trans);
      font-size: 0.85rem;
    }

    .letter-btn:hover:not(:disabled) {
      background: var(--lcd-bg);
    }

    .letter-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .letter-btn.correct {
      background: var(--lcd-good);
      border-color: var(--lcd-good);
      color: var(--lcd-bg);
    }

    .letter-btn.wrong {
      background: var(--lcd-bad);
      border-color: var(--lcd-bad);
      color: var(--lcd-bg);
    }

    .message {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      margin: .4rem 0;
      min-height: 1.2rem;
      color: var(--lcd-ink);
    }

    .message.success {
      color: var(--lcd-good);
    }

    .message.error {
      color: var(--lcd-bad);
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: .6rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .word-display {
        font-size: 1.4rem;
        letter-spacing: 0.3rem;
        word-break: break-all;
      }
      .hangman-display {
        font-size: 2.1rem;
        height: 56px;
      }
      .guessed-letters {
        gap: 0.35rem;
      }
      .letter-btn {
        width: 38px;
        height: 42px;
        font-size: 0.9rem;
      }
      .guesses-info {
        gap: 6px;
        padding: .55rem;
      }
      .info-value {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h6"></path><path d="M7 21V4h9"></path><path d="M16 4v3"></path><circle cx="16" cy="9" r="2"></circle><line x1="16" y1="11" x2="16" y2="16"></line><line x1="13" y1="13" x2="19" y2="13"></line><line x1="16" y1="16" x2="13" y2="19"></line><line x1="16" y1="16" x2="19" y2="19"></line></svg> Hangman</h1>
    <a href="index.html" class="back-button"><svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Hub</a>
  </div>

  <div class="game-container">
    <div class="hangman-display" id="hangmanDisplay">🎯</div>
    
    <div class="word-display" id="wordDisplay"></div>

    <div class="guesses-info">
      <div class="info-item">
        <span class="info-label">Wrong Guesses</span>
        <span class="info-value"><span id="wrongCount">0</span>/6</span>
      </div>
      <div class="info-item">
        <span class="info-label">Correct Guesses</span>
        <span class="info-value" id="correctCount">0</span>
      </div>
    </div>

    <div class="message" id="message"></div>

    <div class="guessed-letters" id="guessedLetters"></div>

    <div class="controls">
      <button class="btn" onclick="newGame()">New Game</button>
      <button class="btn secondary" onclick="location.href='index.html'">Back to Hub</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/hangman.js"></script>

</body>
</html>

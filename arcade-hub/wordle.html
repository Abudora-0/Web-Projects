<!DOCTYPE html>
<html lang="en">
<head>
  <style>@view-transition{navigation:auto}::view-transition-group(root),::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:cubic-bezier(.7,0,.3,1)}</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wordle - Guess the word in 6 attempts. Play this word puzzle game on ArcadeHub!">
  <title>Wordle - ArcadeHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-info {
      text-align: center;
      margin-bottom: .3rem;
      color: var(--lcd-ink-soft);
      font-size: 0.8rem;
    }

    .wordle-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.28rem;
      max-width: 245px;
      margin: 0 auto .3rem;
    }

    .tile {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--lcd-ink);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 700;
      background: var(--lcd-bg-deep);
      color: var(--lcd-ink);
      cursor: default;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .tile.filled {
      background: var(--lcd-bg);
    }

    .tile.correct {
      background: var(--lcd-good);
      border-color: var(--lcd-good);
      color: var(--lcd-bg);
    }

    .tile.present {
      background: var(--lcd-warn);
      border-color: var(--lcd-warn);
      color: var(--lcd-bg);
    }

    .tile.absent {
      background: var(--lcd-bezel2);
      border-color: var(--lcd-bezel2);
      color: var(--lcd-ink-soft);
    }

    .tile.reveal {
      animation: revealTile 0.6s ease-in-out;
    }

    @keyframes revealTile {
      0% {
        transform: rotateX(0);
      }
      50% {
        transform: rotateX(90deg);
      }
      100% {
        transform: rotateX(0);
      }
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 0.34rem;
      margin: .4rem auto;
      max-width: 400px;
    }

    .kb-row {
      display: flex;
      gap: 0.34rem;
      justify-content: center;
    }

    .key {
      flex: 1 1 auto;
      max-width: 34px;
      height: 46px;
      padding: 0;
      background: var(--lcd-bg-deep);
      border: 2px solid var(--lcd-ink);
      border-radius: 4px;
      color: var(--lcd-ink);
      font-weight: 700;
      cursor: pointer;
      transition: var(--trans);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key.key-wide {
      max-width: 58px;
      flex-grow: 1.35;
      font-size: 0.58rem;
      font-family: var(--font-display);
    }

    .key:hover:not(:disabled) {
      background: var(--lcd-bg);
    }

    .key:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .key.correct {
      background: var(--lcd-good);
      border-color: var(--lcd-good);
      color: var(--lcd-bg);
    }

    .key.present {
      background: var(--lcd-warn);
      border-color: var(--lcd-warn);
      color: var(--lcd-bg);
    }

    .key.absent {
      background: var(--lcd-bezel2);
      border-color: var(--lcd-bezel2);
      color: var(--lcd-ink-soft);
      opacity: 0.6;
    }

    .control-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .message {
      text-align: center;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: .25rem;
      min-height: 1rem;
      color: var(--lcd-ink);
    }

    .message.error {
      color: var(--lcd-bad);
      animation: shake 0.3s ease-in-out;
    }

    .message.success {
      color: var(--lcd-good);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: .4rem;
      background: var(--lcd-bg-deep);
      padding: .5rem;
      border-radius: 4px;
      border: 2px solid var(--lcd-ink);
    }

    .stat-item {
      text-align: center;
    }

    .stat-item label {
      display: block;
      font-size: 0.6rem;
      color: var(--lcd-ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 3px;
      font-family: var(--font-display);
    }

    .stat-item .value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--lcd-ink);
      font-family: var(--font-display);
    }

    @media (max-width: 480px) {
      .wordle-grid {
        max-width: 300px;
        gap: 0.4rem;
      }

      .tile {
        font-size: 1.35rem;
      }

      .keyboard {
        gap: 0.3rem;
      }

      .kb-row {
        gap: 0.28rem;
      }

      .key {
        flex: 1 1 0;
        min-width: 0;
        max-width: none;
        height: 44px;
        font-size: 0.85rem;
      }

      .key.key-wide {
        flex: 1.4 1 0;
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><rect x="5" y="8" width="2" height="2" fill="currentColor" stroke="none"></rect><rect x="9" y="8" width="2" height="2" fill="currentColor" stroke="none"></rect><rect x="13" y="8" width="2" height="2" fill="currentColor" stroke="none"></rect><rect x="17" y="8" width="2" height="2" fill="currentColor" stroke="none"></rect><rect x="5" y="14" width="14" height="2" fill="currentColor" stroke="none"></rect></svg> Wordle</h1>
    <a href="index.html" class="back-button"><svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Hub</a>
  </div>

  <div class="game-container">
    <div class="game-info">
      <p>Guess the word in 6 attempts. Use the keyboard or click letters below.</p>
    </div>

    <div class="stats">
      <div class="stat-item">
        <label>Attempts Left</label>
        <div class="value" id="attemptsLeft">6</div>
      </div>
      <div class="stat-item">
        <label>Best Score</label>
        <div class="value" id="bestScore">-</div>
      </div>
      <div class="stat-item">
        <label>Win Rate</label>
        <div class="value" id="winRate">0%</div>
      </div>
      <div class="stat-item">
        <label>Streak</label>
        <div class="value" id="streak">0</div>
      </div>
    </div>

    <div class="message" id="message"></div>

    <div class="wordle-grid" id="wordleGrid">
      <!-- Tiles will be generated by JavaScript -->
    </div>

    <div class="keyboard" id="keyboard">
      <!-- Keyboard will be generated by JavaScript -->
    </div>

    <div class="control-buttons">
      <button class="btn" onclick="newGame()">New Game</button>
      <button class="btn secondary" onclick="location.href='index.html'">Back to Hub</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/wordle.js"></script>

</body>
</html>

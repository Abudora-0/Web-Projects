<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simon Says - Remember and repeat the color sequences. Can you reach the highest level? Play on ArcadeHub!">
  <title>Simon Says - ArcadeHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-info {
      text-align: center;
      margin-bottom: .5rem;
      color: var(--lcd-ink-soft);
      font-size: 0.85rem;
    }

    .stats-display {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: .6rem;
      background: var(--lcd-bg-deep);
      padding: .7rem;
      border-radius: 4px;
      border: 2px solid var(--lcd-ink);
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 0.68rem;
      color: var(--lcd-ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-family: var(--font-display);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lcd-ink);
      font-family: var(--font-display);
    }

    /* Simon pads sit on the dark device bezel rather than the LCD screen,
       and keep real color (the game IS a color-memory test). */
    .simon-board {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .75rem;
      max-width: 280px;
      margin: .75rem auto;
      background: var(--lcd-bezel);
      padding: 1rem;
      border-radius: 10px;
      border: 2px solid var(--lcd-bezel2);
    }

    .simon-pad {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      position: relative;
      overflow: hidden;
      opacity: .82;
    }

    .simon-pad.red    { background: #7a3226; }
    .simon-pad.blue   { background: #2c4f68; }
    .simon-pad.green  { background: #33582f; }
    .simon-pad.yellow { background: #7a5f22; }

    .simon-pad.active {
      opacity: 1;
      border-color: var(--lcd-bg);
    }

    .simon-pad:hover:not(:disabled) {
      opacity: 0.95;
    }

    .simon-pad:disabled {
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      font-size: .9rem;
      font-weight: 600;
      margin: .4rem 0;
      min-height: 1.2rem;
      color: var(--lcd-ink);
    }

    .message.error {
      color: var(--lcd-bad);
    }

    .message.success {
      color: var(--lcd-good);
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: .6rem;
    }

    @media (max-width: 560px) {
      .simon-board {
        max-width: 300px;
        gap: .6rem;
        padding: .8rem;
      }
      .stats-display { gap: 6px; padding: .6rem; }
      .stat-value { font-size: 1.25rem; }
      .simon-pad { font-size: 1.7rem; }
    }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></svg> Simon Says</h1>
    <a href="index.html" class="back-button"><svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Hub</a>
  </div>

  <div class="game-container">
    <div class="game-info">
      <p>Watch the pattern and repeat it! Each round adds a new color to remember.</p>
    </div>

    <div class="stats-display">
      <div class="stat-item">
        <span class="stat-label">Level</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Best Level</span>
        <span class="stat-value" id="bestLevel">-</span>
      </div>
    </div>

    <div class="message" id="message"></div>

    <div class="simon-board" id="simonBoard">
      <button class="simon-pad red" data-color="red" onclick="playerPress(this)">🔴</button>
      <button class="simon-pad blue" data-color="blue" onclick="playerPress(this)">🔵</button>
      <button class="simon-pad green" data-color="green" onclick="playerPress(this)">🟢</button>
      <button class="simon-pad yellow" data-color="yellow" onclick="playerPress(this)">🟡</button>
    </div>

    <div class="controls">
      <button class="btn" id="startBtn" onclick="startGame()">Start Game</button>
      <button class="btn secondary" onclick="location.href='index.html'">Back to Hub</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/simon.js"></script>
<a id="back-to-all" href="../" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <style>@view-transition{navigation:auto}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - DEADSTOCK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Cpolygon points='60,6 18,58 46,58 40,96 84,44 54,44' fill='%23ccff00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">
<a class="skip-link" href="#main">Skip to content</a>
<div id="chrome"></div>

<div class="shop-bar" id="shopBar">
  <div class="shop-bar-inner">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
      <input type="search" id="shopSearch" placeholder="SEARCH THE CATALOG" aria-label="Search products">
    </div>
    <div class="chips" id="shopChips"></div>
    <div class="shop-adv">
      <div class="range-field">
        <span>UNDER <b id="shopPriceOut">$500</b></span>
        <input type="range" id="shopPrice" min="40" max="500" step="5" value="500" aria-label="Max price">
      </div>
      <select class="ds-select" id="shopSize" aria-label="Filter by size"></select>
      <select class="ds-select" id="shopSort" aria-label="Sort">
        <option value="featured">FEATURED</option>
        <option value="priceLow">PRICE: LOW</option>
        <option value="priceHigh">PRICE: HIGH</option>
        <option value="name">A TO Z</option>
      </select>
    </div>
  </div>
</div>

<main id="main">
  <div class="wrap section">
    <div class="section-head">
      <h2>The catalog</h2>
      <span class="pcard-cat" id="shopCount">0 PIECES</span>
    </div>
    <div class="pgrid" id="shopGrid"></div>
    <p class="no-results" id="shopNoRes" hidden>NOTHING MATCHES. TRY AGAIN.</p>
  </div>
</main>

<div id="chrome-footer"></div>
<div id="drawer-mount"></div>
<script src="app.js"></script>
<a id="back-to-all" href="../" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>

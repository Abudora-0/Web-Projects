<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Snake Game - Guide the snake to eat food and grow longer. A classic arcade game on ArcadeHub!">
  <title>Snake Game - ArcadeHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #gameCanvas {
      border: 8px solid var(--lcd-bezel);
      border-radius: 8px;
      background: var(--lcd-bg);
      display: block;
      margin: .75rem auto;
      width: 400px;
      max-width: 100%;
      height: auto;
      aspect-ratio: 1;
      touch-action: none;
      box-shadow: inset 0 2px 10px rgba(0,0,0,.3);
    }

    /* On-screen D-pad - shown on touch devices / narrow screens */
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 192px;
      margin: .5rem auto 0;
    }
    .dpad-btn {
      background: var(--lcd-bg-deep);
      color: var(--lcd-ink);
      border: 2px solid var(--lcd-ink);
      border-radius: 6px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .dpad-btn:active { background: var(--lcd-ink); color: var(--lcd-bg); }
    .dpad-btn.up    { grid-area: 1 / 2; }
    .dpad-btn.left  { grid-area: 2 / 1; }
    .dpad-btn.right { grid-area: 2 / 3; }
    .dpad-btn.down  { grid-area: 3 / 2; }

    @media (hover: none), (max-width: 680px) {
      .dpad { display: grid; }
    }

    .difficulty-selector {
      display: flex;
      gap: .5rem;
      justify-content: center;
      margin: .75rem 0;
      flex-wrap: wrap;
    }

    .difficulty-btn {
      padding: 0.6rem 1.2rem;
      background: var(--lcd-bg-deep);
      color: var(--lcd-ink);
      border: 2px solid var(--lcd-ink);
      border-radius: 4px;
      font-weight: 700;
      font-size: .75rem;
      font-family: var(--font-display);
      cursor: pointer;
      transition: var(--trans);
    }

    .difficulty-btn.active {
      background: var(--lcd-ink);
      color: var(--lcd-bg);
      border-color: var(--lcd-ink);
    }

    .difficulty-btn:hover {
      background: var(--lcd-bg);
    }

    @media (max-width: 560px) {
      #gameCanvas { margin: .5rem auto; }
      .difficulty-selector { gap: .4rem; margin: .5rem 0; }
      .difficulty-btn { flex: 1 1 0; padding: .55rem .3rem; font-size: .68rem; }
      #gameStatus { font-size: .8rem !important; }
      .dpad { width: 168px; }
      .dpad-btn { font-size: .95rem; }
    }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 1 4 4c0 2.2-1.8 4-4 4a3 3 0 0 0 0 6c1.7 0 3-1.3 3-3"></path><circle cx="16" cy="7" r="1" fill="currentColor" stroke="none"></circle></svg> Snake Game</h1>
    <a href="index.html" class="back-button"><svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Hub</a>
  </div>

  <div class="game-container">
    <p style="text-align: center; color: var(--lcd-ink-soft); margin-bottom: .5rem; font-size: .85rem;">
      Use arrow keys or WASD to move. Eat the food to grow. Don't hit the walls or yourself!
    </p>

    <div class="difficulty-selector">
      <button class="difficulty-btn active" onclick="setDifficulty(1)">Easy</button>
      <button class="difficulty-btn" onclick="setDifficulty(2)">Medium</button>
      <button class="difficulty-btn" onclick="setDifficulty(3)">Hard</button>
      <button class="difficulty-btn" onclick="setDifficulty(4)">Insane</button>
    </div>

    <div class="game-stats">
      <div class="stat-box">
        <label>Score</label>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat-box">
        <label>High Score</label>
        <div class="value" id="highScore">0</div>
      </div>
      <div class="stat-box">
        <label>Level</label>
        <div class="value" id="level">1</div>
      </div>
      <div class="stat-box">
        <label>Status</label>
        <div class="value" id="gameStatus" style="font-size: 1rem;">Ready</div>
      </div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="dpad" id="dpad" role="group" aria-label="Direction controls">
      <button type="button" class="dpad-btn up" data-dir="up" aria-label="Up">▲</button>
      <button type="button" class="dpad-btn left" data-dir="left" aria-label="Left">◀</button>
      <button type="button" class="dpad-btn right" data-dir="right" aria-label="Right">▶</button>
      <button type="button" class="dpad-btn down" data-dir="down" aria-label="Down">▼</button>
    </div>

    <div class="button-group">
      <button class="btn" id="startBtn" onclick="toggleGame()">Start Game</button>
      <button class="btn secondary" onclick="resetSnake()">New Game</button>
      <button class="btn secondary" onclick="location.href='index.html'">Back to Hub</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/snake.js"></script>
</body>
</html>

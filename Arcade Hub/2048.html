<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2048 - Slide tiles to combine them and reach the 2048 tile. A challenging puzzle game on ArcadeHub!">
  <title>2048 - ArcadeHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-info {
      text-align: center;
      margin-bottom: .5rem;
      color: var(--lcd-ink-soft);
      font-size: 0.85rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: .6rem;
    }

    .stat-box {
      background: var(--lcd-bg-deep);
      padding: .7rem;
      border-radius: 4px;
      border: 2px solid var(--lcd-ink);
      text-align: center;
    }

    .stat-box label {
      display: block;
      font-size: 0.68rem;
      color: var(--lcd-ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-family: var(--font-display);
    }

    .stat-box .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--lcd-ink);
      font-family: var(--font-display);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      max-width: 340px;
      margin: 0 auto .6rem;
      background: var(--lcd-bg-deep);
      padding: 0.6rem;
      border-radius: 6px;
      border: 2px solid var(--lcd-ink);
      touch-action: none;
    }

    @media (max-width: 400px) {
      .game-grid { gap: 0.4rem; padding: 0.5rem; }
      .stats-grid { gap: 6px; }
      .stat-box { padding: .55rem; }
      .stat-box .value { font-size: 1.25rem; }
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      background: var(--lcd-bg-deep);
      color: var(--lcd-ink);
      border: 2px solid var(--lcd-ink-soft);
      transition: all 0.15s ease-in-out;
      position: relative;
    }

    .tile.empty {
      background: var(--lcd-bg-deep);
      border-color: var(--lcd-ink-soft);
      color: transparent;
    }

    .tile.move {
      animation: tileMove 0.15s ease-in-out;
    }

    @keyframes tileMove {
      0% {
        transform: scale(0.95);
      }
      100% {
        transform: scale(1);
      }
    }

    .tile.merge {
      animation: tileMerge 0.2s ease-in-out;
    }

    @keyframes tileMerge {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Tile shades - a lightness ramp within the LCD ink family, darkest = highest value */
    .tile[data-value="2"]  { background: #102745; border-color: var(--lcd-ink); color: var(--lcd-ink); }
    .tile[data-value="4"]  { background: #0e4464; border-color: var(--lcd-ink); color: var(--lcd-ink); }
    .tile[data-value="8"]  { background: #0b6183; border-color: var(--lcd-ink); color: var(--lcd-bg); }
    .tile[data-value="16"] { background: #087da3; border-color: var(--lcd-ink); color: var(--lcd-bg); }
    .tile[data-value="32"] { background: #059ac2; border-color: var(--lcd-ink); color: var(--lcd-bg); }
    .tile[data-value="64"] { background: #03b7e1; border-color: var(--lcd-ink); color: var(--lcd-bg); }

    .tile[data-value="128"] {
      background: var(--lcd-ink);
      color: var(--lcd-bg);
      font-size: 1.05rem;
      border-color: var(--lcd-ink);
    }

    .tile[data-value="256"] {
      background: var(--lcd-ink);
      color: var(--lcd-bg);
      font-size: 1.05rem;
      border: 3px solid var(--lcd-bg-deep);
    }

    .tile[data-value="512"] {
      background: var(--lcd-ink);
      color: var(--lcd-bg);
      font-size: .95rem;
      box-shadow: inset 0 0 0 3px var(--lcd-bg-deep);
    }

    .tile[data-value="1024"] {
      background: var(--lcd-ink);
      color: var(--lcd-bg);
      font-size: .85rem;
      box-shadow: inset 0 0 0 3px var(--lcd-bg-deep), inset 0 0 0 6px var(--lcd-ink);
    }

    .tile[data-value="2048"],
    .tile[data-value="4096"],
    .tile[data-value="8192"],
    .tile[data-value="16384"],
    .tile[data-value="32768"],
    .tile[data-value="65536"] {
      background: var(--lcd-ink);
      color: var(--lcd-bg);
      font-size: .85rem;
      box-shadow: inset 0 0 0 3px var(--lcd-bg-deep), inset 0 0 0 6px var(--lcd-ink), inset 0 0 0 8px var(--lcd-bg-deep);
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: .6rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .message {
      text-align: center;
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: .4rem;
      min-height: 1.2rem;
      color: var(--lcd-ink);
    }

    .message.error {
      color: var(--lcd-bad);
    }

    .message.success {
      color: var(--lcd-good);
    }

    .arrow-keys {
      text-align: center;
      color: var(--lcd-ink-soft);
      font-size: 0.8rem;
      margin-top: .5rem;
    }
  </style>
</head>
<body class="game-page">
  <div class="game-header">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg> 2048</h1>
    <a href="index.html" class="back-button"><svg class="arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Hub</a>
  </div>

  <div class="game-container">
    <div class="game-info">
      <p>Slide tiles to combine them and reach 2048!</p>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <label>Score</label>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat-box">
        <label>Best Score</label>
        <div class="value" id="bestScore">0</div>
      </div>
    </div>

    <div class="message" id="message"></div>

    <div class="game-grid" id="gameGrid">
      <!-- Tiles will be generated by JavaScript -->
    </div>

    <div class="arrow-keys">
      Use arrow keys or swipe to move tiles
    </div>

    <div class="controls">
      <button class="btn" onclick="newGame()">New Game</button>
      <button class="btn secondary" onclick="location.href='index.html'">Back to Hub</button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/2048.js"></script>
</body>
</html>

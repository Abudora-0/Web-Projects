<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specimen - A Type Foundry Book</title>
  <meta name="description" content="Specimen - a foundry-style catalogue of nearly sixty typefaces. Set your own text, run the size waterfall, adjust weight, leading and tracking, and copy the embed." />

  <!-- Letterpress A favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f4f1ea'/%3E%3Cpath d='M16 5 L26 27 H21 L19 22 H13 L11 27 H6 Z M14.2 18 H17.8 L16 12.5 Z' fill='%231a1a1a'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="masthead">
    <div class="mast-title">
      <span class="mast-kicker">Type foundry &middot; specimen book no. 1</span>
      <h1>Specimen</h1>
      <p class="mast-lede">A shelf of working typefaces, set in your words. Turn the knobs; the whole book follows.</p>
    </div>
    <div class="mast-count">
      <b id="shownCount">50</b>
      <span>faces on the table</span>
    </div>
  </header>

  <div class="control-rail" id="rail">
    <div class="rail-inner">
      <label class="ctl ctl-text">
        <span class="ctl-k">Setting copy</span>
        <input type="text" id="sampleText" value="The quick brown fox jumps over the lazy dog" autocomplete="off" spellcheck="false" />
      </label>

      <label class="ctl">
        <span class="ctl-k">Size <b id="sizeVal">64</b> px</span>
        <input type="range" id="sizeRange" min="12" max="160" value="64" step="1" />
      </label>

      <label class="ctl">
        <span class="ctl-k">Weight <b id="weightVal">400</b></span>
        <input type="range" id="weightRange" min="100" max="900" value="400" step="100" />
      </label>

      <label class="ctl">
        <span class="ctl-k">Leading <b id="leadingVal">1.15</b></span>
        <input type="range" id="leadingRange" min="0.8" max="2" value="1.15" step="0.05" />
      </label>

      <label class="ctl">
        <span class="ctl-k">Tracking <b id="trackingVal">0</b> em</span>
        <input type="range" id="trackingRange" min="-0.05" max="0.3" value="0" step="0.005" />
      </label>

      <label class="ctl ctl-select">
        <span class="ctl-k">Alignment</span>
        <span class="select-wrap">
          <select id="alignSel">
            <option value="left">Flush left</option>
            <option value="center">Centred</option>
            <option value="right">Flush right</option>
            <option value="justify">Justified</option>
          </select>
        </span>
      </label>

      <label class="ctl ctl-select">
        <span class="ctl-k">Case</span>
        <span class="select-wrap">
          <select id="caseSel">
            <option value="none">As typed</option>
            <option value="uppercase">Upper</option>
            <option value="lowercase">Lower</option>
            <option value="capitalize">Title</option>
          </select>
        </span>
      </label>

      <div class="ctl ctl-toggle">
        <span class="ctl-k">Show</span>
        <div class="seg" id="viewSeg" role="group" aria-label="Card body">
          <button data-view="pangram" class="on" type="button">Pangram</button>
          <button data-view="paragraph" type="button">Paragraph</button>
          <button data-view="glyphs" type="button">Glyphs</button>
        </div>
      </div>
    </div>

    <div class="filter-bar" id="filterBar">
      <button class="fchip on" data-cat="all" type="button">All</button>
      <button class="fchip" data-cat="serif" type="button">Serif</button>
      <button class="fchip" data-cat="sans" type="button">Sans</button>
      <button class="fchip" data-cat="slab" type="button">Slab</button>
      <button class="fchip" data-cat="mono" type="button">Mono</button>
      <button class="fchip" data-cat="display" type="button">Display</button>
      <button class="fchip" data-cat="hand" type="button">Hand</button>
      <button class="fchip fchip-fav" data-cat="fav" type="button">Kept</button>
      <label class="fsearch">
        <input type="search" id="fontSearch" placeholder="Find a face" autocomplete="off" />
      </label>
    </div>
  </div>

  <main class="book" id="book"></main>

  <p class="colophon">
    Faces served by Google Fonts and loaded as each card comes into view. Set in Fraunces and Spline Sans Mono.
  </p>

  <div class="pairing" id="pairing" hidden>
    <div class="pairing-box">
      <button class="pairing-close" id="pairingClose" aria-label="Close">x</button>
      <p class="pairing-k">A pairing for <b id="pairFor">--</b></p>
      <div class="pair-preview" id="pairPreview"></div>
      <button class="pairing-shuffle" id="pairShuffle" type="button">Another pairing</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="script.js"></script>
<!-- Back to All Projects -->

<a id="back-to-all" href="../" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>

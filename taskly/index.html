<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taskly - The Stationery Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Taskly - A powerful and intuitive to-do list application with task management, priority filtering, and deadline tracking.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-wrapper">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-tasks"></i> Taskly</h2>
        </div>
        
        <div class="stats-container">
            <div class="stat">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <div class="sidebar-filters">
            <h3>Filters</h3>
            <button class="filter-btn active" data-filter="all"><i class="fas fa-list"></i> All Tasks</button>
            <button class="filter-btn" data-filter="pending"><i class="fas fa-circle-notch"></i> Pending</button>
            <button class="filter-btn" data-filter="completed"><i class="fas fa-check-circle"></i> Completed</button>
            <button class="filter-btn" data-filter="today"><i class="fas fa-calendar-day"></i> Today</button>
            <button class="filter-btn" data-filter="overdue"><i class="fas fa-exclamation-circle"></i> Overdue</button>
        </div>

        <div class="sidebar-filters">
            <h3>Priority</h3>
            <button class="priority-filter" data-priority="high"><i class="fas fa-fire"></i> High</button>
            <button class="priority-filter" data-priority="medium"><i class="fas fa-wave-square"></i> Medium</button>
            <button class="priority-filter" data-priority="low"><i class="fas fa-minus-circle"></i> Low</button>
        </div>

        <div class="sidebar-action">
            <button id="undoBtn" class="undo-btn"><i class="fas fa-undo"></i> Undo</button>
            <button id="clearCompleted" class="clear-btn"><i class="fas fa-trash"></i> Clear Done</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1><i class="fas fa-rocket"></i> Your Tasks</h1>
            <div class="header-controls">
                <input type="text" id="searchBox" class="search-box" placeholder="Search tasks...">
                <select id="sortBy" class="sort-select enhance-select">
                    <option value="date">Sort by Date</option>
                    <option value="priority">Sort by Priority</option>
                    <option value="name">Sort by Name</option>
                </select>
            </div>
        </div>

        <div class="task-input-section">
            <div class="input-group">
                <input type="text" id="taskText" placeholder="Add a new task..." />
                <select id="taskPriority" class="enhance-select">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High Priority</option>
                </select>
                <div class="date-wrapper">
                    <input type="date" id="taskDate" class="native-date" />
                    <button type="button" class="date-display"><i class="fas fa-calendar-alt"></i> <span class="date-text"></span></button>
                </div>
                <select id="taskCategory" class="enhance-select">
                    <option value="General">General</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                    <option value="Personal">Personal</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Health">Health</option>
                </select>
                <button id="addTask" class="add-btn"><i class="fas fa-plus"></i> Add Task</button>
            </div>
            <textarea id="taskNotes" placeholder="Add notes (optional)..."></textarea>
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-inbox"></i>
            <p>No tasks yet. Create one to get started!</p>
        </div>

        <ul id="taskList" class="task-list"></ul>
    </div>
</div>

<!-- Edit Task Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Edit Task</h2>
        <div class="modal-form">
            <input type="text" id="editTaskText" placeholder="Task name">
            <textarea id="editTaskNotes" placeholder="Task notes"></textarea>
            <select id="editTaskPriority" class="enhance-select">
                <option value="low">Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
            </select>
            <div class="date-wrapper">
                <input type="date" id="editTaskDate" class="native-date" />
                <button type="button" class="date-display"><i class="fas fa-calendar-alt"></i> <span class="date-text"></span></button>
            </div>
            <select id="editTaskCategory" class="enhance-select">
                <option value="General">General</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>
                <option value="Shopping">Shopping</option>
                <option value="Health">Health</option>
            </select>
            <div class="modal-buttons">
                <button id="saveEditBtn" class="save-btn"><i class="fas fa-save"></i> Save</button>
                <button id="cancelEditBtn" class="cancel-btn"><i class="fas fa-times"></i> Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Notification Toast -->
<div id="toast" class="toast"></div>

<script src="js/script.js"></script>
<!-- Back to All Projects -->
<a id="back-to-all" href="../index.html" style="position:fixed;bottom:16px;left:16px;z-index:99999;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;background:rgba(138,90,53,0.95);color:#fdf6e9;border:1px solid rgba(253,246,233,0.4);border-radius:20px;font-size:0.72rem;font-weight:700;text-decoration:none;backdrop-filter:blur(12px);font-family:system-ui,sans-serif;transition:all .2s;white-space:nowrap;" onmouseover="this.style.background='rgba(109,69,39,0.95)';this.style.borderColor='rgba(253,246,233,0.7)'" onmouseout="this.style.background='rgba(138,90,53,0.95)';this.style.borderColor='rgba(253,246,233,0.4)'"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>All Projects</a>
</body>
</html>

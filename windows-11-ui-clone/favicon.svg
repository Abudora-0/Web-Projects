<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Window icon with Windows 11 style -->
  <g>
    <!-- Top left window -->
    <rect x="6" y="6" width="20" height="18" fill="none" stroke="#0078d4" stroke-width="2"/>
    <line x1="6" y1="12" x2="26" y2="12" stroke="#0078d4" stroke-width="2"/>
    
    <!-- Top right window -->
    <rect x="32" y="6" width="20" height="18" fill="none" stroke="#0078d4" stroke-width="2"/>
    <line x1="32" y1="12" x2="52" y2="12" stroke="#0078d4" stroke-width="2"/>
    
    <!-- Bottom left window -->
    <rect x="6" y="32" width="20" height="18" fill="none" stroke="#0078d4" stroke-width="2"/>
    <line x1="6" y1="38" x2="26" y2="38" stroke="#0078d4" stroke-width="2"/>
    
    <!-- Bottom right window -->
    <rect x="32" y="32" width="20" height="18" fill="none" stroke="#0078d4" stroke-width="2"/>
    <line x1="32" y1="38" x2="52" y2="38" stroke="#0078d4" stroke-width="2"/>
  </g>
</svg>
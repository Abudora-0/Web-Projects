<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeXO - Chalkboard Tic Tac Toe</title>

  <!-- Chalkboard X/O favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%236b4429'/%3E%3Crect x='3' y='3' width='26' height='26' rx='2' fill='%232f4a3d'/%3E%3Cline x1='7' y1='7' x2='14' y2='14' stroke='%23f5f0dc' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='14' y1='7' x2='7' y2='14' stroke='%23f5f0dc' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='21.5' r='4.5' fill='none' stroke='%23f2d47f' stroke-width='2.5'/%3E%3Cline x1='16' y1='4' x2='16' y2='28' stroke='rgba(245,240,220,0.35)' stroke-width='1.4'/%3E%3Cline x1='4' y1='16' x2='28' y2='16' stroke='rgba(245,240,220,0.35)' stroke-width='1.4'/%3E%3C/svg%3E" />

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Confetti canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <div class="wrapper">

    <!-- ── Header ──────────────────────────────── -->
    <header>
      <div class="brand">De<span>XO</span></div>
      <button class="sound-btn" id="soundBtn" title="Toggle Sound">
        <i class="fas fa-volume-high" id="soundIcon"></i>
      </button>
    </header>

    <!-- ── Score Board ─────────────────────────── -->
    <div class="scoreboard">
      <div class="score-card" id="xScoreCard">
        <svg class="score-sym" viewBox="0 0 40 40">
          <line x1="8" y1="8" x2="32" y2="32" stroke="#f5f0dc" stroke-width="5" stroke-linecap="round"/>
          <line x1="32" y1="8" x2="8" y2="32" stroke="#f5f0dc" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="score-info">
          <div class="score-label">PLAYER X</div>
          <div class="score-num" id="xScore">0</div>
        </div>
      </div>
      <div class="score-mid">
        <div class="score-label">DRAW</div>
        <div class="score-num" id="drawScore">0</div>
      </div>
      <div class="score-card" id="oScoreCard">
        <svg class="score-sym" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="13" fill="none" stroke="#f2d47f" stroke-width="5"/>
        </svg>
        <div class="score-info">
          <div class="score-label">PLAYER O</div>
          <div class="score-num" id="oScore">0</div>
        </div>
      </div>
    </div>

    <!-- ── Mode Selector ───────────────────────── -->
    <div class="mode-bar">
      <button class="mode-btn active" id="pvpBtn"><i class="fas fa-users"></i> 2 Players</button>
      <button class="mode-btn" id="aiBtn"><i class="fas fa-robot"></i> vs AI</button>
    </div>

    <!-- ── AI Difficulty ───────────────────────── -->
    <div class="diff-bar hidden" id="diffBar">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard"><i class="fas fa-brain"></i> Hard</button>
    </div>

    <!-- ── Turn Indicator ──────────────────────── -->
    <div class="turn-indicator" id="turnIndicator">
      <div class="turn-avatar" id="turnAvatar">
        <!-- SVG injected by JS -->
      </div>
      <span id="turnText">Player X's turn</span>
    </div>

    <!-- ── Board ───────────────────────────────── -->
    <div class="board-wrap">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>

    <!-- ── Result Banner ───────────────────────── -->
    <div class="result-banner hidden" id="resultBanner">
      <span id="resultText">X Wins!</span>
    </div>

    <!-- ── Buttons ─────────────────────────────── -->
    <div class="btn-row">
      <button class="btn-new" id="newGameBtn"><i class="fas fa-rotate-right"></i> New Game</button>
      <button class="btn-ghost-sm" id="resetScoresBtn"><i class="fas fa-trash"></i> Reset Scores</button>
    </div>

    <!-- ── Keyboard hint ───────────────────────── -->
    <p class="hint">Press <kbd>1</kbd>–<kbd>9</kbd> to play &nbsp;·&nbsp; <kbd>R</kbd> to reset</p>

  </div><!-- /wrapper -->

  <script src="script.js"></script>
<!-- Back to All Projects -->

<a id="back-to-all" href="../portfolio/" aria-label="Back to all projects" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px 11px;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em;text-decoration:none;color:#fff;background:rgba(17,17,19,.74);border:1px solid rgba(255,255,255,.16);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .15s,transform .15s" onmouseover="this.style.background='rgba(17,17,19,.94)';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(17,17,19,.74)';this.style.transform='none'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>PROJECTS</a>
</body>
</html>
